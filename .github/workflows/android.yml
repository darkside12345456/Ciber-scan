name: Build APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      # Precaução: o gradlew precisa do binário gradle-wrapper.jar. Se algum
      # .gitignore o tiver excluído, repomo-lo aqui para a build não falhar logo.
      - name: Repor o wrapper se faltar
        run: |
          if [ ! -f gradle/wrapper/gradle-wrapper.jar ]; then
            curl -sL https://services.gradle.org/distributions/gradle-8.9-bin.zip -o gradle.zip
            unzip -q gradle.zip
            gradle-8.9/bin/gradle wrapper --gradle-version 8.9
          fi

      - run: chmod +x gradlew

      - name: Testes unitários + APK de debug
        run: ./gradlew testDebugUnitTest assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: privacyscanner-debug-apk
          path: app/build/outputs/apk/debug/*.apk
